services:
  oracle:
    profiles: ["oracle"]
    image: oracleinanutshell/oracle-xe-11g
    container_name: aims-oracle
    ports:
      - '1521:1521'
    healthcheck:
      test: ["CMD-SHELL", "echo 'select 1 from dual;' | ORACLE_HOME=/u01/app/oracle/product/11.2.0/xe ORACLE_SID=XE /u01/app/oracle/product/11.2.0/xe/bin/sqlplus -s system/oracle@//localhost:1521/xe | grep -Eq '^[[:space:]]*1[[:space:]]*$'"]
      interval: 10s
      retries: 30
      timeout: 10s
      start_period: 60s

  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aims-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'Del12345!'
    ports:
      - '1433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Del12345!' -Q 'SELECT 1' -No"]
      interval: 10s
      retries: 10
      timeout: 10s
      start_period: 30s

  webfrontend:
    build:
      context: .
      dockerfile: src/AIMS.WebFrontend/Dockerfile
    container_name: aims-webfrontend
    depends_on:
      sqlserver:
        condition: service_healthy
        required: false
      oracle:
        condition: service_healthy
        required: false
    ports:
      - '8081:8081'
    environment:
      ASPNETCORE_URLS: 'http://+:8081'
      ASPNETCORE_ENVIRONMENT: 'Development'
      DatabaseProvider: ${DATABASE_PROVIDER:-Oracle}
      ConnectionStrings__SqlServer: 'Server=sqlserver;Database=aimsdb;User Id=sa;Password=Del12345!;MultipleActiveResultSets=True;TrustServerCertificate=True'
      ConnectionStrings__Oracle: 'Data Source=oracle:1521/xe;User Id=system;Password=oracle;'
    restart: on-failure

volumes:
  sqlserver-data:
